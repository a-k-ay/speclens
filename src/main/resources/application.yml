server:
  # Render (and most PaaS) tell the app which port to listen on via PORT.
  port: ${PORT:8080}
  # Trust X-Forwarded-For from the platform's proxy, so rate limits see the real client IP.
  forward-headers-strategy: native

spring:
  application:
    name: speclens
  # Read local secrets from .env (git-ignored). Missing file is fine: on Render the
  # same keys come from real environment variables.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/speclens}
    username: ${DB_USER:speclens}
    password: ${DB_PASSWORD:speclens}
    hikari:
      # Small pool: free-tier Neon and a 512 MB Render box don't need more.
      maximum-pool-size: 5
      # With a project_id filter, a plain HNSW scan can return fewer than LIMIT rows when
      # most nearest neighbours belong to other projects. pgvector 0.8 iterative scans keep
      # searching until enough matching rows are found, in exact distance order.
      connection-init-sql: SET hnsw.iterative_scan = strict_order
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    google:
      genai:
        # Gemini Developer API (API key), not Vertex AI. See docs/adr/0001.
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            # Flash-Lite by default: Flash answers paraphrased questions better but its free
            # tier allows only 20 requests a day. Set GEMINI_CHAT_MODEL=gemini-3.5-flash with a
            # paid key. See docs/adr/0001.
            model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
            # Zero temperature: answers should restate the documents, not improvise, and
            # should vary as little as possible between runs.
            temperature: 0.0
            max-output-tokens: 600
        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            options:
              model: gemini-embedding-2
              # Must match vector(768) in V2__create_document_and_chunk.sql.
              dimensions: 768

speclens:
  upload:
    # Set UPLOAD_ENABLED=false on the public demo to serve preloaded documents only.
    enabled: ${UPLOAD_ENABLED:true}
    max-pages: 60
  chunking:
    # Characters, not tokens. See docs/adr/0004.
    size: 1000
    overlap: 150
  retrieval:
    # Each search returns this many candidates; RRF merges them and keeps top-k.
    candidates: 20
    top-k: 5
    rrf-k: 60
    # Refuse without calling the model when the best source is less similar than this.
    # Chosen from the evaluation set: lowest answerable similarity (0.639) minus a 0.05
    # safety margin. See docs/adr/0006 and docs/EVAL.md.
    min-similarity: 0.58
  demo:
    # Load the fictional sample documents into the demo project at startup (idempotent).
    seed: ${DEMO_SEED:false}
    project-name: Northwind Freight (sample client)
    documents-dir: ${DEMO_DOCUMENTS_DIR:samples}
  rate-limit:
    # Protects the Gemini key on the public demo. Applies to ask, upload and story generation.
    per-ip-per-minute: ${RATE_LIMIT_PER_IP_PER_MINUTE:10}
    per-ip-per-day: ${RATE_LIMIT_PER_IP_PER_DAY:100}
    global-per-day: ${RATE_LIMIT_GLOBAL_PER_DAY:500}
  mock-tracker:
    # Fictional Jira-like tracker served by this app under /mock-tracker (see docs/adr/0011).
    enabled: ${MOCK_TRACKER_ENABLED:true}
    # Make every tracker call return 503, to demo and test the "tracker is down" path.
    simulate-outage: ${TRACKER_SIMULATE_OUTAGE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
