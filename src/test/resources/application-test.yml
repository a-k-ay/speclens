# Test profile: no real Gemini calls, ever. CI has no API key.
spring:
  ai:
    model:
      # Switch off Spring AI's real Gemini beans; FakeAiConfiguration provides fakes.
      chat: none
      embedding:
        text: none
    google:
      genai:
        # Placeholder so Spring AI's connection auto-configuration can start; never used.
        api-key: test-key-not-used
        embedding:
          api-key: test-key-not-used
speclens:
  upload:
    max-pages: 5
  retrieval:
    # Fake bag-of-words embeddings give much lower similarities than Gemini, so the
    # threshold is off in tests; AskThresholdIntegrationTest checks it explicitly.
    min-similarity: 0.0
  rate-limit:
    # Integration tests send many requests from 127.0.0.1; RateLimiterTest covers the limits.
    per-ip-per-minute: 100000
    per-ip-per-day: 100000
    global-per-day: 100000
