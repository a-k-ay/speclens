# Build and test on every push and pull request.
# Tests use Testcontainers (real Postgres + pgvector in Docker, which GitHub's Ubuntu
# runners provide) and fake AI models, so CI needs no Gemini key and costs nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Pull the database image up front so the test log shows test time, not download time.
      - name: Pull pgvector image
        run: docker pull pgvector/pgvector:0.8.7-pg17

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
